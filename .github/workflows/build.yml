name: Lotse bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: App bauen
        run: gradle assembleDebug --no-daemon

      - name: Datei umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk lotse.apk

      - name: Download-Seite aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aktuell --yes --cleanup-tag || true
          gh release create aktuell lotse.apk \
            --title "Lotse – aktuelle Testversion" \
            --notes "Version 0.1.${{ github.run_number }} vom $(TZ=Europe/Berlin date +'%d.%m.%Y, %H:%M') Uhr"
