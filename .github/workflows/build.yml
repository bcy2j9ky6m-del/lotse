name: Lotse bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: App bauen
        env:
          LOTSE_SERVER: ${{ secrets.LOTSE_SERVER }}
          LOTSE_TOKEN: ${{ secrets.LOTSE_TOKEN }}
        run: gradle assembleDebug --no-daemon

      - name: Datei mit Versionsnummer benennen
        run: cp app/build/outputs/apk/debug/app-debug.apk lotse-0.1.${{ github.run_number }}.apk

      - name: Datei zusätzlich im Zweig "downloads" ablegen (einfacher Direkt-Link)
        run: |
          mkdir dl && cp lotse-0.1.${{ github.run_number }}.apk dl/
          cd dl
          git init -q -b downloads
          git config user.name "Lotse-Bau"
          git config user.email "lotse-bau@users.noreply.github.com"
          git add .
          git commit -q -m "Lotse 0.1.${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" downloads

      - name: Download-Seite aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aktuell --yes --cleanup-tag || true
          gh release create aktuell lotse-0.1.${{ github.run_number }}.apk \
            --title "Lotse 0.1.${{ github.run_number }}" \
            --notes "Version 0.1.${{ github.run_number }} vom $(TZ=Europe/Berlin date +'%d.%m.%Y, %H:%M') Uhr" \
            --latest
